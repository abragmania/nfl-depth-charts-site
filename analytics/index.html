<!doctype html>
<html lang="en">
<head>
<!-- Google tag (gtag.js) --><script async src="https://www.googletagmanager.com/gtag/js?id=G-Y8MNFFYKRD"></script><script>window.dataLayer = window.dataLayer || [];function gtag(){dataLayer.push(arguments);}gtag('js', new Date());gtag('config', 'G-Y8MNFFYKRD');window.addEventListener('hashchange', function () { gtag('event', 'page_view', { page_location: location.href, page_path: location.pathname + location.hash }); });</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- D177: the analytics app, a separate page from the depth charts. Same D67 convention as the depth charts'
     index.html: the publish step rewrites this to "1" in the published copy, and js/data.js then reads the
     pre-rendered files under ../api/analytics/ instead of the local server. -->
<meta name="nfl-static" content="1">
<title>NFL Analytics</title>
<link rel="stylesheet" href="css/analytics.css">
<link rel="stylesheet" href="css/analytics_recut.css">
<link rel="stylesheet" href="css/analytics_grid.css">
<!-- D209 part (2): the depth-chart card block (public/js/panel.js's cardBodyHtml, drawn at the top of every
     player page) is styled by the depth-chart app's own two stylesheets: styles.css for the shared :root
     tokens and badge colours the card's classes read, panel.css for the ".panel-*" component rules
     themselves (the card's actual look lives there, not in styles.css). Checked by hand, 2026-09-28: no
     harmful class-name collisions with this app's own CSS — every card/history class is prefixed
     "panel-"/"hist-", which this app's CSS never uses (it is all "an-*"); the one shared family, ".badge"/
     ".badge-q"/"-d"/"-out"/"-susp" etc., is already a DELIBERATE copy (analytics_recut.css's own comment:
     "copies the depth chart's look and colours"), so loading both is redundant, not conflicting. zoom.css,
     matchup.css, phone.css and guide.css style other depth-chart pages and are left out. -->
<link rel="stylesheet" href="../css/styles.css">
<link rel="stylesheet" href="../css/panel.css">
<!-- D224 increment C: the week's games strip on the This-week page (views/week.js) is the depth-chart pages' own
     strip (public/js/gamesbar.js), styled by its own rules in matchup.css; every selector there is matchup-, games- or
     game- prefixed, none of which this app's an-* CSS uses. -->
<link rel="stylesheet" href="../css/matchup.css">
</head>
<body>
<!-- D209 part (1): the shared site strip (../js/sitebar.js), painted into #sitebar by js/main.js's side-effect
     import of it. Replaces the old .an-brand "NFL ANALYTICS" brand and the .an-topbar-depth "Depth chart ↗"
     new-tab link back to the depth-chart app; those two are gone. -->
<!-- Adam, 2026-09-28 ("this seems like a waste of a line"): the app's own PLAYERS / TEAMS nav sits ON the strip
     line, right after the Analytics tab, with the stamp at the right end; the strip wraps the nav under itself
     only when the window is too narrow for the whole line. The nav keeps its own wiring in js/nav.js. -->
<header class="an-top">
  <div id="sitebar" data-section="analytics"></div>
  <nav id="an-nav" class="an-nav" aria-label="Sections"></nav>
  <span id="an-asof" class="an-asof" hidden></span>
</header>
<main id="app" class="an-main" aria-live="polite"></main>
<script type="module" src="js/main.js"></script>
</body>
</html>
